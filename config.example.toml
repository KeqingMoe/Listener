# Copy to config.toml. Store only the selected secrets in .env (or process environment).
# All relative file paths, including .env, resolve from the config.toml directory.
[bot]
name = 'Listener'
owner_id = '100000001'
owner_name = '時雨てる'

[onebot]
url = 'ws://127.0.0.1:3001'
token_env = 'ONEBOT_ACCESS_TOKEN'
api_timeout_ms = 10000
reconnect_base_ms = 1000
reconnect_max_ms = 30000
heartbeat_ms = 30000

[ai]
enabled = false
base_url = 'https://api.openai.com/v1'
model = '' # Set a model and provide OPENAI_API_KEY before enabling AI.
api_key_env = 'OPENAI_API_KEY'
timeout_ms = 45000
max_output_tokens = 1200
max_concurrent_turns = 2 # 全局并行处理群批次数，1..8；模型/密钥仍由全部群共享

[persona]
file = 'prompts/listener.md'

# 使用同一个 [ai] 模型的原生多模态能力；模型必须支持图片输入。
# 关闭时不提供 view_images，也不下载或向模型上传图片。
[images]
enabled = false
max_per_turn = 3 # 每轮最多3张，失败尝试也占额度
max_download_mb = 10 # 单张最多10MiB；解码后最多4000万像素，缩放到2048边长

# 按1-based闭区间读取合并转发；嵌套需再次调用工具，不自动展开给模型。
[forward]
enabled = false
max_per_read = 20 # 每次1..20条；转发内部图片暂时只显示占位

# 关注计划：可等待下一条消息（next）、指定成员（member）、定时（timer）或活跃度（activity）。
# 同一计划内多个条件是 OR 关系；多份计划独立共存，命中一份不会取消其他计划。
# 不取代随机抽签；不需要随机参与时自行把 reply.random_probability 调为 0。
# 没有新消息时不调用模型；/reset、断线和重启会清空计划，计划不写入数据库。
[attention]
enabled = false
max_plans = 16 # 每群最多1..32份计划的资源上限，不是回复条数或表情数量配额

# 所有级别均不记录正文、密钥、图片或完整工具参数。
[logging]
level = 'info' # debug/info/warn/error；普通消息跳过原因仅 debug
console = true
file = true
directory = 'data/logs' # 相对 config.toml；JSONL 文件不入库
retention_days = 7 # 按 UTC 天，在写入时清理；1..30
max_file_mb = 20 # MiB，1..100；跨日或到达大小上限轮转
max_total_mb = 200 # MiB，必须 >= max_file_mb，最大1000

[reply]
mention = true
quote_bot = true
random_probability = 0.03
delay_ms = [1200, 3000]
cooldown_ms = 5000
max_parts = 3 # 每轮回复条数上限，1..10；默认3，不要求凑满

[reply.random]
cooldown_ms = 60000
max_per_minute = 2

[memory]
path = 'data/listener.sqlite'
retention_days = 7
context_chars = 24000

[tools]
members = true
mention = true
# 给当前群消息添加／取消自己的表情回应，不是发送 face 消息，不需主人确认。
# 同时自动在模型看到的消息旁展示已知 reaction 快照；通知只更新缓存，不唤醒模型。
# 不依赖模型主动查询、不修改摘要；缺失或空快照不能断言无人回应。
# 独立于 members、mention 和 moderation；关闭不会自动移除已有回应。
# 候选目录来自完整 NapCat sysface（329）+ emoji（165），不表示逐项实测可用。
reactions = false

[tools.moderation]
mute = true
recall = true
member_card = true
confirmation_ttl_seconds = 60
max_mute_seconds = 600

# 显式服务白名单，最多32个配置群。上方均为全局默认，各群仅覆盖需要不同的字段。
# groups 是唯一白名单来源；未配置、空表或全部 enabled=false 均不服务任何群。禁用群的配置仍须合法。
[groups.'100000002']
enabled = true

# 新增群示例（替换群号后取消注释）：默认只在本群响应，不共享聊天记忆。
# [groups.'123456789']
# enabled = true
# [groups.'123456789'.reply]
# random_probability = 0
# [groups.'123456789'.tools]
# reactions = true # 仅为这个群启用；其他 tools 字段继承全局
# [groups.'123456789'.tools.moderation]
# mute = false
# recall = false
# member_card = false
# [groups.'123456789'.images]
# enabled = true
# [groups.'123456789'.forward]
# enabled = true
# [groups.'123456789'.attention]
# enabled = true
# max_plans = 16 # 未填写的字段继承全局 attention
# [groups.'123456789'.memory]
# retention_days = 7
# context_chars = 24000
# path = 'data/groups/123456789/listener.sqlite' # 默认已按群隔离，无需填写；不能与其他启用群共用文件
# [groups.'123456789'.persona]
# append_file = 'prompts/group-extra.md' # 可选，每文件最多16KiB UTF-8，追加于全局人设后；文件须存在

# 原100000002群继续使用全局 memory.path，不迁移或重标记数据库。
# 其他群默认使用全局 memory.path 所在目录下的 groups/<群号>/listener.sqlite。
# 每群不能覆盖 AI/密钥/模型、连接、名字或主人身份；管理确认规则不能放宽。
